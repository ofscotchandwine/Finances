<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mis finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E3EEE1; --panel:#EEF5EB; --card:#FCFEFB; --line:#E1EBDF;
  --ink:#22332B; --ink2:#55695E; --muted:#6E8176;
  --g900:#123B2A; --g700:#006A3F; --g500:#2F8F62; --g300:#A9D3B5; --g100:#DCEDDC;
  --warn:#B5473A; --warn-bg:#FBECE8;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --sans:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --r:18px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);font-size:13.5px;line-height:1.45;color:var(--ink);
  background:
    radial-gradient(900px 500px at 8% -10%,#F3F9EF 0%,transparent 60%),
    radial-gradient(800px 600px at 100% 0%,#D5E8D6 0%,transparent 55%),
    var(--bg);
  background-attachment:fixed;min-height:100vh}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--g700)}
.num{font-variant-numeric:tabular-nums}

/* ---------- layout ---------- */
.app{max-width:1480px;margin:0 auto;padding:20px;display:grid;grid-template-columns:236px minmax(0,1fr);gap:16px}
.top{grid-column:1/-1;display:grid;grid-template-columns:236px auto repeat(4,minmax(0,1fr));gap:16px;align-items:stretch}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
main{min-width:0}
.card{background:var(--card);border-radius:var(--r);padding:18px 18px 16px;box-shadow:0 1px 0 #fff inset,0 8px 24px -18px rgba(18,59,42,.35);border:1px solid rgba(255,255,255,.7)}
.card h2{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--g700);letter-spacing:.1px;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card h2 a{font-family:var(--sans);font-weight:500;font-size:11px;text-decoration:none;color:var(--muted);white-space:nowrap}
.label{font-size:10.5px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--g500)}
.sub{color:var(--ink2);font-size:12px}
.empty{color:var(--muted);font-size:12.5px;padding:14px 4px;text-align:center}
.empty a{font-weight:500}

/* ---------- header ---------- */
.brand{display:flex;flex-direction:column;justify-content:center;padding:6px 6px 6px 8px}
.brand h1{font-family:var(--serif);font-style:italic;font-weight:600;font-size:27px;color:var(--g700);line-height:1.1}
.brand span{margin-top:6px}
.clock{display:flex;gap:6px;align-items:center}
.clock b{position:relative;display:grid;place-items:center;width:62px;height:66px;border-radius:14px;background:var(--g900);color:#F4FBF3;font-weight:600;font-size:31px;letter-spacing:.5px;font-variant-numeric:tabular-nums;box-shadow:0 10px 18px -12px rgba(18,59,42,.7)}
.clock b::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.09)}
.clock small{position:absolute;top:5px;left:8px;font-size:8px;font-weight:600;letter-spacing:.8px;opacity:.75}
.kpi{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:12px 16px;min-width:0}
.kpi .row{display:flex;align-items:center;gap:8px;min-width:0}
.kpi svg{flex:none;width:26px;height:26px;padding:5px;border-radius:9px;background:var(--g100);color:var(--g700)}
.kpi .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.kpi strong{font-size:19px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.neg{color:var(--warn)}

/* ---------- sidebar ---------- */
.cal{background:var(--panel)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 10px}
.cal-head strong{font-family:var(--serif);font-style:italic;font-weight:500;font-size:20px;text-transform:capitalize}
.cal-head small{display:block;font-family:var(--sans);font-style:normal;font-size:10.5px;color:var(--muted);letter-spacing:1px}
.ico{border:0;background:transparent;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--ink2);transition:transform 140ms var(--ease-out),background-color 140ms}
.ico:active{transform:scale(.94)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid span{font-size:10px;font-weight:600;color:var(--muted);padding:4px 0}
.cal-grid button{position:relative;border:0;background:transparent;height:28px;border-radius:9px;font-size:11.5px;color:var(--ink2);transition:background-color 140ms}
.cal-grid button.today{color:#fff;font-weight:600;background:var(--g700);border-radius:60% 8px 60% 8px}
.cal-grid button.has::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--g500)}
.cal-grid button.today.has::after{background:#CFEBD6}
.hoy{margin-top:8px;width:100%;border:1px dashed var(--g300);background:transparent;border-radius:10px;padding:5px;font-size:11px;color:var(--g700)}
.nav{background:var(--panel);padding-bottom:12px}
.nav ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav ul a{display:block;padding:7px 10px;border-radius:10px;text-decoration:none;font-size:10.5px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink2);transition:background-color 140ms,color 140ms}
.nav ul a[aria-current="page"]{background:var(--card);color:var(--g700);box-shadow:0 4px 12px -10px rgba(18,59,42,.6)}
.sync{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.sync i{flex:none;width:7px;height:7px;border-radius:50%;margin-top:5px;background:#B9C6BD}
.sync.on i{background:var(--g500)}

/* ---------- dashboard grid ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c12{grid-column:span 12}
.view{animation:fade 180ms var(--ease-out)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.first .grid>.card{animation:rise 260ms var(--ease-out) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

table{width:100%;border-collapse:collapse}
th{font-size:10px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);text-align:right;padding:4px 6px 8px;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:2px}
td{padding:7px 6px;text-align:right;white-space:nowrap}
.sum td{font-size:12.5px}
.sum tr.final td{background:var(--g100);font-weight:600;color:var(--g900)}
.sum tr.final td:first-child{border-radius:10px 0 0 10px;padding-left:10px}
.sum tr.final td:last-child{border-radius:0 10px 10px 0}
.sum tr.final.bad td{background:var(--warn-bg);color:var(--warn)}
.diff{color:var(--muted);font-size:11.5px}
.flow{display:flex;flex-direction:column;gap:9px;font-size:12.5px}
.flow div{display:flex;justify-content:space-between;gap:10px}
.flow .tot{border-top:1px solid var(--line);padding-top:10px;font-weight:600}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:11.5px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.legend b{font-weight:500;color:var(--ink)}
svg.chart{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:var(--sans);font-size:10px;fill:var(--muted)}
.donut-wrap{display:grid;place-items:center}
.donut-wrap svg{width:min(190px,70%)}
.donut-wrap .tot{font-size:13px;font-weight:600;fill:var(--ink)}
.donut-wrap .cap{font-size:7.5px;letter-spacing:1.2px;fill:var(--muted)}

.list{display:flex;flex-direction:column;gap:11px}
.list .li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;font-size:12.5px}
.list .li>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .li small{grid-column:1/-1;color:var(--muted);font-size:11px}
.list .li .meter{grid-column:1/-1;margin-top:3px}
.list .off{opacity:.5}
.meter{height:6px;border-radius:6px;background:var(--g100);overflow:hidden}
.meter i{display:block;height:100%;width:100%;border-radius:6px;background:var(--g700);transform-origin:left;transition:transform 240ms var(--ease-out)}
.meter.over i{background:var(--warn)}
.goal{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(60px,1fr) auto;gap:4px 12px;align-items:center;font-size:12.5px}
.goal small{grid-column:1/-1;color:var(--muted);font-size:11px;margin-top:-2px}

.cc{position:relative;border-radius:16px;padding:14px 16px;color:#F2FAF1;background:linear-gradient(135deg,#0F4A30 0%,#2F8F62 70%,#6FB58A 100%);overflow:hidden;box-shadow:0 12px 20px -16px rgba(18,59,42,.9)}
.cc::before{content:"";position:absolute;right:-30px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08)}
.cc .n{font-weight:500;font-size:12.5px;display:flex;justify-content:space-between;gap:8px}
.cc .d{font-size:20px;font-weight:600;margin:10px 0 2px}
.cc .s{font-size:11px;opacity:.85}
.cc .meter{background:rgba(255,255,255,.22);margin:10px 0 6px}
.cc .meter i{background:#F2FAF1}
.cc+.cc{margin-top:10px}

/* ---------- edit views ---------- */
.wrap{max-width:1020px;display:flex;flex-direction:column;gap:16px}
.cols{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:2px 4px}
.intro h2{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--g700);border:0;margin:0;padding:0}
.scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
.ed{min-width:520px}
.ed td{padding:4px 4px}
.ed th{padding:4px 10px 8px}
.ed td:first-child{padding-left:0}
.in{font:inherit;color:var(--ink);width:100%;min-width:0;background:#F3F8F1;border:1px solid transparent;border-radius:9px;padding:7px 9px;transition:border-color 140ms,background-color 140ms,box-shadow 140ms}
.in:focus{outline:none;background:#fff;border-color:var(--g500);box-shadow:0 0 0 3px rgba(47,143,98,.16)}
.in::placeholder{color:#9AAAA0}
select.in{padding-right:4px}
.money{display:flex;align-items:center;background:#F3F8F1;border:1px solid transparent;border-radius:9px;padding-left:9px;color:var(--muted);transition:border-color 140ms,background-color 140ms,box-shadow 140ms}
.money:focus-within{background:#fff;border-color:var(--g500);box-shadow:0 0 0 3px rgba(47,143,98,.16)}
.money .in{background:transparent;border:0;box-shadow:none;text-align:right;padding-left:4px;font-variant-numeric:tabular-nums}
.w-day{width:62px}.w-money{width:132px}.w-date{width:132px}
.del{border:0;background:transparent;width:28px;height:28px;border-radius:8px;color:var(--muted);font-size:16px;line-height:1;transition:transform 140ms var(--ease-out),background-color 140ms,color 140ms}
.del:active{transform:scale(.92)}
.btn{border:1px solid var(--g300);background:transparent;color:var(--g700);font-weight:500;font-size:12.5px;border-radius:11px;padding:8px 14px;transition:transform 160ms var(--ease-out),background-color 160ms}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--g700);border-color:var(--g700);color:#fff}
.btn[disabled]{opacity:.6;cursor:default}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.tots{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.tots b{color:var(--ink);font-weight:600}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:11px;font-weight:500;color:var(--ink2)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.addrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px;align-items:end;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ed select.in{min-width:140px}
.addrow .btn{justify-self:start;min-width:120px}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) 124px 28px;gap:6px;align-items:center}
.catrow .z{grid-column:1/-1;font-size:11px;color:var(--muted);margin:2px 0 8px}
.catrow .z .meter{margin-bottom:4px}
.metarow{display:grid;grid-template-columns:minmax(140px,1.4fr) 132px 132px minmax(120px,1fr) 28px;gap:6px 12px;align-items:center;margin-bottom:10px}
.metarow>:nth-child(1){grid-area:n}.metarow>:nth-child(2){grid-area:a}.metarow>:nth-child(3){grid-area:o}.metarow>:nth-child(4){grid-area:z}.metarow>:nth-child(5){grid-area:d}
.metarow{grid-template-areas:"n a o z d"}
.check{width:18px;height:18px;accent-color:var(--g700)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.steps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink2);font-size:12.5px}
.steps b{color:var(--ink);font-weight:500}
.note{background:var(--panel);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--ink2)}
.status{font-size:12px;color:var(--ink2)}
.status.ok{color:var(--g700)}.status.err{color:var(--warn)}
details summary{cursor:pointer;font-size:12px;color:var(--ink2);margin:4px 0 10px}

/* ---------- floating bits ---------- */
.savebar{position:fixed;left:50%;bottom:18px;z-index:30;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:16px;background:var(--g900);color:#EAF6EA;font-size:12.5px;box-shadow:0 18px 30px -14px rgba(18,59,42,.8);
  transform:translate(-50%,14px);opacity:0;pointer-events:none;transition:transform 220ms var(--ease-out),opacity 220ms var(--ease-out)}
.savebar.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.savebar .btn{background:#EAF6EA;border-color:#EAF6EA;color:var(--g900);padding:7px 14px}
.toast{position:fixed;left:50%;bottom:74px;z-index:31;display:flex;gap:12px;align-items:center;max-width:min(92vw,460px);padding:9px 14px;border-radius:13px;background:#fff;color:var(--ink);font-size:12.5px;border:1px solid var(--line);box-shadow:0 14px 28px -16px rgba(18,59,42,.6);
  transform:translate(-50%,10px);opacity:0;pointer-events:none;transition:transform 200ms var(--ease-out),opacity 200ms var(--ease-out)}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast.err{border-color:#E9C2BB;color:var(--warn)}
.toast button{border:0;background:transparent;color:var(--g700);font-weight:600;padding:2px 4px}
.tip{position:fixed;z-index:40;pointer-events:none;background:var(--g900);color:#F2FAF1;font-size:11.5px;line-height:1.4;padding:6px 9px;border-radius:9px;white-space:pre-line;opacity:0;transition:opacity 120ms;max-width:220px}
.tip.show{opacity:1}
[data-tip]{cursor:default}
.hit{fill:transparent}

@media (hover:hover) and (pointer:fine){
  .ico:hover,.del:hover{background:var(--g100)}
  .del:hover{color:var(--warn)}
  .cal-grid button:not(.today):hover{background:var(--g100)}
  .nav ul a:not([aria-current="page"]):hover{background:rgba(255,255,255,.6)}
  .btn:hover{background:var(--g100)}
  .btn.pri:hover{background:#00573A}
  .savebar .btn:hover{background:#fff}
  .card h2 a:hover{color:var(--g700)}
  .in:hover,.money:hover{border-color:var(--g300)}
  .money .in:hover{border-color:transparent}
  .bar:hover,.seg:hover{opacity:.82}
}
:focus-visible{outline:2px solid var(--g500);outline-offset:2px}
.in:focus-visible{outline:none}

@media (max-width:1240px){
  .top{grid-template-columns:repeat(4,minmax(0,1fr))}
  .top .brand{grid-column:span 2}.top .clock{grid-column:span 2;justify-self:end}
  .c3,.c4{grid-column:span 6}.c5{grid-column:span 12}
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);padding:14px;gap:12px}
  .top{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .top .brand{grid-column:1}.top .clock{grid-column:2}
  .clock b{width:50px;height:54px;font-size:25px}
  .brand h1{font-size:23px}
  .cal-grid,.hoy{display:none}
  .cal{padding:10px 14px}.cal .label{display:none}.cal-head{margin:0}
  .nav{padding:8px}.nav .label,.sync{display:none}
  .nav ul{flex-direction:row;overflow-x:auto;margin:0;gap:4px;scrollbar-width:none}
  .nav ul a{white-space:nowrap}
  .grid{gap:12px}.c3,.c4,.c5,.c6{grid-column:span 12}
  .addrow{grid-template-columns:1fr 1fr}
  .addrow .btn{grid-column:1/-1;justify-self:stretch}
  .cols{grid-template-columns:minmax(0,1fr)}
  .metarow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 28px;grid-template-areas:"n n d" "a o ." "z z .";margin-bottom:18px}
  .metarow .w-money{width:auto}
  .kpi strong{font-size:17px}
}
@media (prefers-reduced-motion:reduce){
  .view,.first .grid>.card{animation:none}
  .savebar,.toast{transition:opacity 150ms;transform:translate(-50%,0)}
  .meter i,.btn,.ico,.del{transition:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>Mis finanzas</h1><span class="label">Panel personal</span></div>
    <div class="clock" id="clock" aria-label="Hora actual"></div>
    <div class="card kpi" data-zone="kpi" data-arg="0"></div>
    <div class="card kpi" data-zone="kpi" data-arg="1"></div>
    <div class="card kpi" data-zone="kpi" data-arg="2"></div>
    <div class="card kpi" data-zone="kpi" data-arg="3"></div>
  </header>
  <aside class="side">
    <section class="card cal" id="cal" aria-label="Mes seleccionado"></section>
    <nav class="card nav" id="nav" aria-label="Secciones"></nav>
  </aside>
  <main id="view"><div class="card empty">Cargando tus datos…</div></main>
</div>
<div class="savebar" id="savebar" role="status"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip"></div>

<script>
/* =====================================================================
   Mis finanzas — página estática para GitHub Pages.
   Los datos viven en data.json dentro del repositorio; el botón Guardar
   los sube con la API de GitHub usando un token guardado en este navegador.
   ===================================================================== */

/* ---------- datos iniciales (se usan si todavía no existe data.json) ---------- */
const DEFAULT_DATA = {
  version: 1,
  categorias: ["Suscripciones", "Transporte"],
  metas: [],
  tarjetas: [],
  meses: {
    "2026-11": {
      saldoInicial: 0,
      ingresos: [
        { id: "i1", nombre: "Mami Ini", esperado: 0, recibido: 0, dia: 1 },
        { id: "i2", nombre: "Madre", esperado: 0, recibido: 0, dia: 1 },
        { id: "i3", nombre: "Padre", esperado: 0, recibido: 0, dia: 1 }
      ],
      fijos: [],
      suscripciones: [
        { id: "s1", nombre: "Apple", valor: 0, dia: 1, nota: "", activa: true },
        { id: "s2", nombre: "Google One", valor: 20000, dia: 1, nota: "", activa: true },
        { id: "s3", nombre: "Spotify", valor: 0, dia: 1, nota: "", activa: true },
        { id: "s4", nombre: "Apple TV", valor: 0, dia: 1, nota: "", activa: true },
        { id: "s5", nombre: "Disney", valor: 45000, dia: 1, nota: "", activa: true },
        { id: "s6", nombre: "Chat GPT", valor: 15000, dia: 1, nota: "Valor total $99.000, entre 7", activa: true }
      ],
      categorias: [{ nombre: "Transporte", presupuesto: 0 }],
      variables: [],
      ahorro: { presupuesto: 0, real: 0 }
    }
  }
};

/* Paleta categórica validada (familia de verdes); la séptima categoría en adelante va a "Otros". */
const PALETA = ["#006a3f", "#9bc14d", "#46712b", "#58c1a0", "#008672", "#c8ad3f"];
const GRIS = "#9AA89F";
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const VISTAS = [["panel","Panel"],["ingresos","Ingresos"],["fijos","Gastos fijos"],["suscripciones","Suscripciones"],["variables","Gastos variables"],["tarjetas","Tarjetas de crédito"],["metas","Metas de ahorro"],["ajustes","Ajustes"]];
const CFG_KEY = "finanzas-cfg";

const S = { data: null, mes: ym(new Date()), vista: "panel", dirty: false, saving: false, virtual: {}, cfg: {}, fuente: "local", fechaNueva: null, primera: true, estado: null };

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const n0 = v => (Number.isFinite(+v) ? +v : 0);
const sum = (a, f) => a.reduce((t, x) => t + n0(f(x)), 0);
const miles = n => String(Math.abs(Math.round(n0(n)))).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const fmt = n => (n0(n) < 0 ? "−" : "") + "$" + miles(n);
const sgn = n => (n0(n) > 0 ? "+" : "") + fmt(n);
function abr(n) {
  const a = Math.abs(n), s = n < 0 ? "−" : "";
  if (a >= 1e6) return s + "$" + String(Math.round(a / 1e5) / 10).replace(".", ",") + " M";
  if (a >= 1e3) return s + "$" + Math.round(a / 1e3) + " k";
  return s + "$" + Math.round(a);
}
function ym(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
function ymd(d) { return ym(d) + "-" + String(d.getDate()).padStart(2, "0"); }
function partes(key) { const [y, m] = key.split("-").map(Number); return { y, m }; }
function mover(key, d) { const { y, m } = partes(key); return ym(new Date(y, m - 1 + d, 1)); }
function diasDe(key) { const { y, m } = partes(key); return new Date(y, m, 0).getDate(); }
function nombreMes(key) { return MESES[partes(key).m - 1]; }

/* ---------- modelo ---------- */
function mesVacio() { return { saldoInicial: 0, ingresos: [], fijos: [], suscripciones: [], categorias: [], variables: [], ahorro: { presupuesto: 0, real: 0 } }; }
function normalizar(d) {
  d = d && typeof d === "object" ? d : {};
  d.version = 1;
  d.categorias = Array.isArray(d.categorias) ? d.categorias : [];
  d.metas = Array.isArray(d.metas) ? d.metas : [];
  d.tarjetas = Array.isArray(d.tarjetas) ? d.tarjetas : [];
  d.meses = d.meses && typeof d.meses === "object" ? d.meses : {};
  for (const k of Object.keys(d.meses)) {
    const m = Object.assign(mesVacio(), d.meses[k]);
    for (const f of ["ingresos", "fijos", "suscripciones", "categorias", "variables"]) if (!Array.isArray(m[f])) m[f] = [];
    m.ahorro = Object.assign({ presupuesto: 0, real: 0 }, m.ahorro);
    d.meses[k] = m;
  }
  return d;
}
/* Un mes que todavía no existe se muestra como copia del anterior (sin lo recibido ni lo gastado)
   y solo se guarda de verdad cuando se edita algo en él. */
function plantilla(key) {
  const keys = Object.keys(S.data.meses).sort();
  const prev = keys.filter(k => k < key).pop() || keys[0];
  const m = mesVacio();
  if (!prev) return m;
  const b = S.data.meses[prev];
  m.ingresos = b.ingresos.map(x => ({ ...x, id: uid(), recibido: 0 }));
  m.fijos = b.fijos.map(x => ({ ...x, id: uid(), pagado: 0 }));
  m.suscripciones = b.suscripciones.map(x => ({ ...x, id: uid() }));
  m.categorias = b.categorias.map(x => ({ ...x }));
  m.ahorro = { presupuesto: n0(b.ahorro.presupuesto), real: 0 };
  if (prev === mover(key, -1)) m.saldoInicial = calc(b).saldoR;
  return m;
}
function mes() {
  if (S.data.meses[S.mes]) return S.data.meses[S.mes];
  return S.virtual[S.mes] || (S.virtual[S.mes] = plantilla(S.mes));
}
function mesEditable() {
  if (!S.data.meses[S.mes]) { S.data.meses[S.mes] = mes(); delete S.virtual[S.mes]; }
  return S.data.meses[S.mes];
}
function activas(m) { return m.suscripciones.filter(s => s.activa !== false); }
function calc(m) {
  const ingP = sum(m.ingresos, x => x.esperado), ingR = sum(m.ingresos, x => x.recibido);
  const fijP = sum(m.fijos, x => x.presupuesto), fijR = sum(m.fijos, x => x.pagado);
  const sub = sum(activas(m), x => x.valor);
  const varP = sum(m.categorias, x => x.presupuesto), varR = sum(m.variables, x => x.valor);
  const gasP = fijP + sub + varP, gasR = fijR + sub + varR;
  const ahoP = n0(m.ahorro.presupuesto), ahoR = n0(m.ahorro.real), ini = n0(m.saldoInicial);
  return { ini, ingP, ingR, fijP, fijR, sub, varP, varR, gasP, gasR, ahoP, ahoR, saldoP: ini + ingP - gasP - ahoP, saldoR: ini + ingR - gasR - ahoR };
}
function gastoCat(m, nombre) { return sum(m.variables.filter(v => (v.categoria || "Otros") === nombre), v => v.valor); }
function registrarCat(nombre) { if (nombre && !S.data.categorias.includes(nombre)) S.data.categorias.push(nombre); }
function colorCat(nombre) { const i = S.data.categorias.indexOf(nombre); return i >= 0 && i < PALETA.length ? PALETA[i] : GRIS; }
/* Gasto real por categoría: suscripciones + fijos (por su categoría) + variables. */
function porCategoria(m) {
  const map = new Map();
  const add = (k, v) => { if (n0(v) > 0) map.set(k, (map.get(k) || 0) + n0(v)); };
  add("Suscripciones", sum(activas(m), x => x.valor));
  m.fijos.forEach(f => add(f.categoria || "Gastos fijos", f.pagado));
  m.variables.forEach(v => add(v.categoria || "Otros", v.valor));
  const items = [...map].map(([nombre, valor]) => ({ nombre, valor, color: colorCat(nombre) }));
  const propios = items.filter(i => i.color !== GRIS), otros = items.filter(i => i.color === GRIS);
  propios.sort((a, b) => S.data.categorias.indexOf(a.nombre) - S.data.categorias.indexOf(b.nombre));
  if (otros.length === 1) propios.push(otros[0]);
  else if (otros.length > 1) propios.push({ nombre: "Otros", valor: sum(otros, o => o.valor), color: GRIS });
  return propios;
}
/* Saldo día a día: saldo inicial + ingresos recibidos − gastos (sin contar el ahorro). */
function serieDiaria(m, key) {
  const N = diasDe(key), mov = new Array(N + 1).fill(0);
  const dia = d => Math.min(N, Math.max(1, Math.round(n0(d)) || 1));
  m.ingresos.forEach(x => mov[dia(x.dia)] += n0(x.recibido));
  m.fijos.forEach(x => mov[dia(x.dia)] -= n0(x.pagado));
  activas(m).forEach(x => mov[dia(x.dia)] -= n0(x.valor));
  m.variables.forEach(x => mov[dia(String(x.fecha || "").slice(8, 10))] -= n0(x.valor));
  const hoy = new Date(), fin = key === ym(hoy) ? hoy.getDate() : N;
  const out = []; let s = n0(m.saldoInicial);
  for (let d = 1; d <= N; d++) { s += mov[d]; if (d <= fin) out.push({ d, v: s }); }
  return { N, pts: out };
}

/* ---------- gráficas (SVG) ---------- */
function techo(v) { if (v <= 0) return 1; const p = 10 ** Math.floor(Math.log10(v)), n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function barra(x, y, w, h) { const r = Math.min(4, h, w / 2); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }
function chartBarras(c) {
  const g = [["Ingresos", c.ingP, c.ingR], ["Gastos", c.gasP, c.gasR], ["Ahorro", c.ahoP, c.ahoR]];
  const max = Math.max(...g.flatMap(x => [x[1], x[2]]));
  if (max <= 0) return `<div class="empty">Cuando registres montos, aquí verás lo planeado frente a lo real.</div>`;
  const W = 360, H = 190, L = 44, B = 24, T = 8, top = techo(max), ph = H - B - T, bw = 24, gw = (W - L) / g.length;
  const y = v => T + ph - (v / top) * ph;
  let s = "";
  for (const f of [0, .5, 1]) s += `<line x1="${L}" x2="${W}" y1="${y(top * f)}" y2="${y(top * f)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(top * f) + 3}" text-anchor="end">${abr(top * f)}</text>`;
  g.forEach(([n, p, r], i) => {
    const cx = L + gw * i + gw / 2, hp = (p / top) * ph, hr = (r / top) * ph;
    if (p > 0) s += `<path class="bar" d="${barra(cx - bw - 1, y(p), bw, hp)}" fill="var(--g300)" data-tip="${esc(n)} · Presupuesto\n${fmt(p)}"/>`;
    if (r > 0) s += `<path class="bar" d="${barra(cx + 1, y(r), bw, hr)}" fill="var(--g700)" data-tip="${esc(n)} · Real\n${fmt(r)}"/>`;
    s += `<text x="${cx}" y="${H - 7}" text-anchor="middle">${n}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Presupuesto frente a real: ${g.map(x => `${x[0]} ${fmt(x[1])} planeado, ${fmt(x[2])} real`).join("; ")}">${s}</svg>
  <div class="legend"><span><i style="background:var(--g300)"></i>Presupuesto</span><span><i style="background:var(--g700)"></i>Real</span></div>`;
}
function chartDona(items) {
  const total = sum(items, i => i.valor);
  if (total <= 0) return `<div class="empty">Aún no hay gastos este mes.</div>`;
  const r = 52, C = 2 * Math.PI * r, gap = items.length > 1 ? 2 : 0;
  let off = 0, s = "";
  items.forEach(it => {
    const len = (it.valor / total) * C, vis = Math.max(len - gap, 1);
    s += `<circle class="seg" cx="70" cy="70" r="${r}" fill="none" stroke="${it.color}" stroke-width="21" stroke-dasharray="${vis} ${C - vis}" stroke-dashoffset="${-off}" data-tip="${esc(it.nombre)}\n${fmt(it.valor)} · ${pct(it.valor / total)}"/>`;
    off += len;
  });
  return `<div class="donut-wrap"><svg viewBox="0 0 140 140" role="img" aria-label="Distribución de gastos por categoría">
    <g transform="rotate(-90 70 70)">${s}</g>
    <path d="M70 52c-6 1-9 6-8 11 5 0 9-4 8-11z" fill="var(--g500)"/><path d="M71 55c5 0 8 3 8 8-5 1-8-3-8-8z" fill="var(--g300)"/>
    <text class="tot" x="70" y="78" text-anchor="middle">${fmt(total)}</text><text class="cap" x="70" y="89" text-anchor="middle">TOTAL</text></svg></div>
  <div class="legend">${items.map(it => `<span><i style="background:${it.color}"></i>${esc(it.nombre)} <b>${pct(it.valor / total)}</b></span>`).join("")}</div>`;
}
function pct(f) { const p = f * 100; return (p > 0 && p < 10 ? String(Math.round(p * 10) / 10).replace(".", ",") : Math.round(p)) + "%"; }
let LINEA = null;
function chartLinea(m, key) {
  const { N, pts } = serieDiaria(m, key);
  const c = calc(m);
  if (!pts.length || (c.ini === 0 && c.ingR === 0 && c.gasR === 0)) { LINEA = null; return `<div class="empty">Aquí verás cómo cambia tu saldo durante el mes.</div>`; }
  const W = 430, H = 190, L = 46, B = 22, T = 10, R = 8;
  const vals = pts.map(p => p.v), mn = Math.min(0, ...vals), mx = Math.max(0, ...vals);
  const lo = mn < 0 ? -techo(-mn) : 0, hi = mx > 0 ? techo(mx) : 0;
  const x = d => L + ((d - 1) / Math.max(1, N - 1)) * (W - L - R), y = v => T + (H - B - T) * (1 - (v - lo) / (hi - lo));
  let s = `<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F8F62" stop-opacity=".22"/><stop offset="1" stop-color="#2F8F62" stop-opacity="0"/></linearGradient></defs>`;
  for (const f of [0, .5, 1]) { const v = lo + (hi - lo) * f; s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${abr(v)}</text>`; }
  if (lo < 0) s += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
  for (const d of [...new Set([1, 8, 15, 22, N])]) s += `<text x="${x(d)}" y="${H - 6}" text-anchor="middle">${d}</text>`;
  const path = pts.map((p, i) => (i ? "L" : "M") + x(p.d).toFixed(1) + "," + y(p.v).toFixed(1)).join("");
  const last = pts[pts.length - 1];
  s += `<path d="${path}L${x(last.d)},${y(lo)}L${x(1)},${y(lo)}Z" fill="url(#ga)"/><path d="${path}" fill="none" stroke="var(--g700)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  s += `<circle cx="${x(last.d)}" cy="${y(last.v)}" r="4" fill="var(--g700)" stroke="var(--card)" stroke-width="2"/>`;
  s += `<g id="lh" style="display:none"><line id="lhx" y1="${T}" y2="${H - B}" stroke="var(--g300)"/><circle id="lhc" r="4.5" fill="var(--g700)" stroke="var(--card)" stroke-width="2"/></g>`;
  s += `<rect class="hit" id="lhit" x="${L}" y="${T}" width="${W - L - R}" height="${H - B - T}"/>`;
  LINEA = { pts, x, y, N, L, W, R, key };
  return `<svg class="chart" id="linea" viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo día a día; termina en ${fmt(last.v)} el día ${last.d}">${s}</svg>`;
}

/* ---------- piezas de interfaz ---------- */
const ICON = {
  ing: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9M14.5 9.8c-.4-.9-1.3-1.3-2.5-1.3-1.5 0-2.5.7-2.5 1.8 0 2.600 5 1.100 5 3.700 0 1.100-1 1.800-2.500 1.800-1.300 0-2.200-.5-2.600-1.400"/></svg>',
  gas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.500" width="18" height="13" rx="2.500"/><path d="M3 10h18M7 15h4"/></svg>',
  aho: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-9M12 12c0-4 2.500-6.500 7-7 .3 4.500-2.500 7-7 7zM12 15c0-3-2-5-5.500-5.500C6.200 13 8.500 15 12 15z"/></svg>',
  sal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.500A2.500 2.500 0 0 1 6.500 5H18v3M4 7.500V17a2.500 2.500 0 0 0 2.500 2.500H20V8H6.500A2.500 2.500 0 0 1 4 7.500zM16.500 13.700h.01"/></svg>'
};
function inMoney(p, v, extra = "") { return `<label class="money w-money"><span>$</span><input class="in" type="text" inputmode="numeric" data-p="${p}" data-t="money" value="${n0(v) ? miles(v) : ""}" placeholder="0" ${extra}></label>`; }
function inText(p, v, ph = "", extra = "") { return `<input class="in" type="text" data-p="${p}" data-t="text" value="${esc(v)}" placeholder="${esc(ph)}" ${extra}>`; }
function inDia(p, v) { return `<input class="in w-day" type="number" min="1" max="31" inputmode="numeric" data-p="${p}" data-t="day" value="${n0(v) || ""}" placeholder="1" aria-label="Día del mes">`; }
function btnDel(p, what) { return `<button class="del" data-act="del" data-p="${p}" aria-label="Eliminar ${esc(what || "fila")}" title="Eliminar">×</button>`; }
function meter(f, over) { return `<div class="meter${over ? " over" : ""}"><i style="transform:scaleX(${Math.max(0, Math.min(1, f)).toFixed(3)})"></i></div>`; }
function opcionesCat(m, actual) {
  const nombres = m.categorias.map(c => c.nombre).filter(Boolean);
  if (actual && !nombres.includes(actual)) nombres.push(actual);
  if (!nombres.length) nombres.push("Otros");
  return nombres.map(n => `<option${n === actual ? " selected" : ""}>${esc(n)}</option>`).join("");
}
function opcionesMedio(actual) {
  return `<option value="">Efectivo/débito</option>` + S.data.tarjetas.map(t => `<option value="${esc(t.id)}"${t.id === actual ? " selected" : ""}>${esc(t.nombre || "Tarjeta")}</option>`).join("");
}
function tarjetaVisual(t, m) {
  const cupo = n0(t.cupo), deuda = n0(t.deuda), uso = cupo > 0 ? deuda / cupo : 0;
  const delMes = sum(m.variables.filter(v => v.medio === t.id), v => v.valor);
  return `<div class="cc"><div class="n"><span>${esc(t.nombre || "Tarjeta")}</span><span>${cupo > 0 ? pct(uso) + " usado" : ""}</span></div>
    <div class="d num">${fmt(deuda)}</div><div class="s">Deuda actual${cupo > 0 ? " · disponible " + fmt(cupo - deuda) : ""}</div>
    ${meter(uso)}<div class="s">Corte: día ${n0(t.corte) || "—"} · Pago: día ${n0(t.pago) || "—"}${delMes ? " · Este mes: " + fmt(delMes) : ""}</div></div>`;
}

/* ---------- zonas calculadas (se refrescan sin tocar los campos que se están editando) ---------- */
const Z = {
  kpi(i) {
    const c = calc(mes());
    const k = [["Ingresos", c.ingR, ICON.ing], ["Gastos", c.gasR, ICON.gas], ["Ahorro", c.ahoR, ICON.aho], ["Saldo final", c.saldoR, ICON.sal]][i];
    return `<div class="row">${k[2]}<span class="label">${k[0]}</span></div><strong class="num${k[1] < 0 ? " neg" : ""}">${fmt(k[1])}</strong>`;
  },
  totIngresos() { const c = calc(mes()); return `<span>Esperado <b class="num">${fmt(c.ingP)}</b></span><span>Recibido <b class="num">${fmt(c.ingR)}</b></span><span>Falta por recibir <b class="num">${fmt(Math.max(0, c.ingP - c.ingR))}</b></span>`; },
  totFijos() { const c = calc(mes()); return `<span>Presupuesto <b class="num">${fmt(c.fijP)}</b></span><span>Pagado <b class="num">${fmt(c.fijR)}</b></span>`; },
  totSubs() { const m = mes(), c = calc(m); return `<span>Total mensual <b class="num">${fmt(c.sub)}</b></span><span>Al año <b class="num">${fmt(c.sub * 12)}</b></span><span>Activas <b>${activas(m).length}</b></span>`; },
  totVars() { const c = calc(mes()); return `<span>Presupuesto <b class="num">${fmt(c.varP)}</b></span><span>Gastado <b class="num">${fmt(c.varR)}</b></span>`; },
  catFila(i) {
    const m = mes(), cat = m.categorias[i]; if (!cat) return "";
    const g = gastoCat(m, cat.nombre), p = n0(cat.presupuesto), over = p > 0 && g > p;
    return (p > 0 ? meter(g / p, over) : "") + `Gastado ${fmt(g)}` + (p > 0 ? (over ? ` · te pasaste por ${fmt(g - p)}` : ` · quedan ${fmt(p - g)}`) : "");
  },
  tarjeta(i) { const t = S.data.tarjetas[i]; return t ? tarjetaVisual(t, mes()) : ""; },
  meta(i) {
    const g = S.data.metas[i]; if (!g) return "";
    const o = n0(g.objetivo), a = n0(g.actual), f = o > 0 ? a / o : 0;
    return `${meter(f)}<small class="sub">${o > 0 ? pct(Math.min(f, 9.99)) + (a >= o ? " · meta cumplida" : " · faltan " + fmt(o - a)) : "Escribe el objetivo para ver el avance"}</small>`;
  },
  totAhorro() { const c = calc(mes()); return c.ahoP > 0 ? `${meter(c.ahoR / c.ahoP)}<small class="sub">${pct(Math.min(c.ahoR / c.ahoP, 9.99))} de la meta de este mes</small>` : `<small class="sub">Define cuánto quieres ahorrar este mes.</small>`; }
};
function refrescarZonas() { document.querySelectorAll("[data-zone]").forEach(el => { const f = Z[el.dataset.zone]; if (f) el.innerHTML = f(el.dataset.arg !== undefined ? +el.dataset.arg : undefined); }); }

/* ---------- vistas ---------- */
const titulo = (t, sub) => `<div class="intro"><div><h2>${t}</h2><p class="sub">${sub}</p></div><span class="label">${nombreMes(S.mes)} ${partes(S.mes).y}</span></div>`;
const V = {
  panel() {
    const m = mes(), c = calc(m), cats = porCategoria(m);
    const fila = (n, p, r, malo) => `<tr><td>${n}</td><td class="num">${fmt(p)}</td><td class="num">${fmt(r)}</td><td class="num diff${malo ? " neg" : ""}">${sgn(r - p)}</td></tr>`;
    const totalGasto = sum(cats, x => x.valor);

/* ---------- render ---------- */
function renderCal() {
  const { y, m } = partes(S.mes), N = diasDe(S.mes), ini = (new Date(y, m - 1, 1).getDay() + 6) % 7;
  const hoy = new Date(), esHoy = S.mes === ym(hoy), con = new Set(mes().variables.map(v => +String(v.fecha).slice(8, 10)));
  let g = ["L", "M", "M", "J", "V", "S", "D"].map(d => `<span>${d}</span>`).join("") + "<i></i>".repeat(ini);
  for (let d = 1; d <= N; d++) g += `<button class="${esHoy && d === hoy.getDate() ? "today " : ""}${con.has(d) ? "has" : ""}" data-act="dia" data-d="${d}" aria-label="${d} de ${MESES[m - 1]}${con.has(d) ? ", con gastos" : ""}">${d}</button>`;
  $("#cal").innerHTML = `<span class="label">Mes seleccionado</span>
    <div class="cal-head"><button class="ico" data-act="mes" data-d="-1" aria-label="Mes anterior">‹</button><strong>${MESES[m - 1]}<small>${y}</small></strong><button class="ico" data-act="mes" data-d="1" aria-label="Mes siguiente">›</button></div>
    <div class="cal-grid">${g}</div>${esHoy ? "" : `<button class="hoy" data-act="hoy">Volver a este mes</button>`}`;
}
function renderNav() {
  const on = !!(S.cfg.token && S.cfg.owner && S.cfg.repo);
  const act = S.data.actualizado ? new Date(S.data.actualizado) : null;
  $("#nav").innerHTML = `<span class="label">Navegación</span><ul>${VISTAS.map(([k, t]) => `<li><a href="#${k}"${k === S.vista ? ' aria-current="page"' : ""}>${t}</a></li>`).join("")}</ul>
    <div class="sync${on ? " on" : ""}"><i></i><span>${on ? "Conectada a GitHub" : `Sin conectar: los cambios no se guardan. <a href="#ajustes">Conectar</a>`}${act && !isNaN(act) ? `<br>Último guardado: ${act.getDate()} ${MESES[act.getMonth()].slice(0, 3)}, ${act.toLocaleTimeString("es-CO", { hour: "numeric", minute: "2-digit" })}` : ""}</span></div>`;
}
function renderVista() {
  const v = $("#view");
  v.innerHTML = `<div class="view${S.primera ? " first" : ""}">${(V[S.vista] || V.panel)()}</div>`;
  S.primera = false;
}
function renderSave() {

  b.innerHTML = `<span>${S.saving ? "Guardando en GitHub…" : "Tienes cambios sin guardar"}</span><button class="btn" data-act="guardar" ${S.saving ? "disabled" : ""}>Guardar</button>`;

function render() { renderCal(); renderNav(); renderVista(); refrescarZonas(); renderSave(); }
function sucio() { S.dirty = true; S.virtual = {}; renderSave(); }
function reloj() {
  const d = new Date(), h = d.getHours();

/* ---------- avisos ---------- */
let toastT = null, deshacer = null;
function toast(msg, opt = {}) {
  const t = $("#toast"); clearTimeout(toastT); deshacer = opt.undo || null;
  t.className = "toast show" + (opt.err ? " err" : "");
  t.innerHTML = `<span>${esc(msg)}</span>${opt.undo ? `<button data-act="deshacer">Deshacer</button>` : ""}`;
  toastT = setTimeout(() => { t.classList.remove("show"); deshacer = null; }, opt.err ? 7000 : opt.undo ? 6000 : 2600);
}
const tip = $("#tip");
function verTip(txt, x, y) { tip.textContent = txt; tip.classList.add("show"); const w = tip.offsetWidth, h = tip.offsetHeight; tip.style.left = Math.max(6, Math.min(innerWidth - w - 6, x + 12)) + "px"; tip.style.top = Math.max(6, y - h - 12) + "px"; }
function ocultarTip() { tip.classList.remove("show"); const g = $("#lh"); if (g) g.style.display = "none"; }
document.addEventListener("pointermove", e => {
  const el = e.target instanceof Element ? e.target : null;
  if (el && el.id === "lhit" && LINEA) {
    const svg = $("#linea"), box = svg.getBoundingClientRect(), k = LINEA.W / box.width, px = (e.clientX - box.left) * k;
    const d = Math.round(1 + ((px - LINEA.L) / (LINEA.W - LINEA.L - LINEA.R)) * (LINEA.N - 1));
    const p = LINEA.pts.reduce((a, b) => (Math.abs(b.d - d) < Math.abs(a.d - d) ? b : a));
    const cx = LINEA.x(p.d), cy = LINEA.y(p.v);
    $("#lh").style.display = ""; $("#lhx").setAttribute("x1", cx); $("#lhx").setAttribute("x2", cx); $("#lhc").setAttribute("cx", cx); $("#lhc").setAttribute("cy", cy);
    verTip(`${p.d} de ${nombreMes(LINEA.key)}\n${fmt(p.v)}`, box.left + cx / k, box.top + cy / k);
    return;
  }
  const t = el && el.closest("[data-tip]");
  if (t) verTip(t.dataset.tip, e.clientX, e.clientY); else ocultarTip();
});
document.addEventListener("pointerleave", ocultarTip);

/* ---------- edición ---------- */
function resolver(path) {
  const p = path.split("."), raiz = p[0] === "m" ? mesEditable() : S.data;
  let o = raiz; for (let i = 1; i < p.length - 1; i++) o = o[p[i]];
  return { o, k: p[p.length - 1] };
}
document.addEventListener("change", e => {
  const el = e.target; if (!el.dataset || !el.dataset.p) return;
  const t = el.dataset.t; let v;
  if (t === "money") { v = parseInt(el.value.replace(/\D/g, ""), 10) || 0; el.value = v ? miles(v) : ""; }
  else if (t === "day") { v = Math.min(31, Math.max(1, parseInt(el.value, 10) || 1)); el.value = v; }
  else if (t === "check") v = el.checked;
  else v = el.value.trim();
  const { o, k } = resolver(el.dataset.p);
  const antes = o[k];
  if (el.dataset.cat && antes !== v) {            // renombrar una categoría también actualiza sus movimientos
    mesEditable().variables.forEach(x => { if (x.categoria === antes) x.categoria = v; });
    const i = S.data.categorias.indexOf(antes);
    if (v && i >= 0 && !S.data.categorias.includes(v)) S.data.categorias[i] = v; else registrarCat(v);
  }
  if (el.dataset.p.endsWith(".categoria")) registrarCat(v);
  o[k] = v; sucio(); refrescarZonas();
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset && el.dataset.t === "money") { const d = el.value.replace(/\D/g, "").replace(/^0+(?=\d)/, ""); el.value = d ? miles(d) : ""; }
});
document.addEventListener("focusin", e => { if (e.target.dataset && e.target.dataset.t === "money") e.target.select(); });
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.dataset && e.target.dataset.p) e.target.blur(); });
document.addEventListener("submit", e => {
  if (e.target.id !== "form-var") return; e.preventDefault();
  const f = new FormData(e.target), valor = parseInt(String(f.get("valor")).replace(/\D/g, ""), 10) || 0;
  if (!valor) { toast("Escribe el valor del gasto.", { err: true }); return; }
  const m = mesEditable(), categoria = String(f.get("categoria") || "Otros");
  registrarCat(categoria);
  m.variables.push({ id: uid(), fecha: String(f.get("fecha")), descripcion: String(f.get("descripcion")).trim(), categoria, medio: String(f.get("medio")), valor });
  S.fechaNueva = String(f.get("fecha")); sucio(); render();
  const d = $('#form-var [name="descripcion"]'); if (d) d.focus();
});
const NUEVOS = {
  ingresos: () => ({ id: uid(), nombre: "", esperado: 0, recibido: 0, dia: 1 }),
  fijos: () => ({ id: uid(), nombre: "", categoria: "", presupuesto: 0, pagado: 0, dia: 1 }),
  suscripciones: () => ({ id: uid(), nombre: "", valor: 0, dia: 1, nota: "", activa: true }),
  categorias: () => ({ nombre: "", presupuesto: 0 }),
  metas: () => ({ id: uid(), nombre: "", actual: 0, objetivo: 0 }),
  tarjetas: () => ({ id: uid(), nombre: "", cupo: 0, deuda: 0, corte: 0, pago: 0 })
};
document.addEventListener("click", e => {
  const b = e.target instanceof Element ? e.target.closest("[data-act]") : null; if (!b) return;
  const a = b.dataset.act;
  if (a === "mes") { S.mes = mover(S.mes, +b.dataset.d); S.fechaNueva = null; render(); }
  else if (a === "hoy") { S.mes = ym(new Date()); S.fechaNueva = null; render(); }
  else if (a === "dia") { S.fechaNueva = `${S.mes}-${String(b.dataset.d).padStart(2, "0")}`; if (S.vista === "variables") render(); else location.hash = "variables"; }
  else if (a === "add") {
    const k = b.dataset.k, global = k === "metas" || k === "tarjetas", arr = (global ? S.data : mesEditable())[k];
    arr.push(NUEVOS[k]()); sucio(); render();
    const el = $(`[data-p="${global ? "g" : "m"}.${k}.${arr.length - 1}.nombre"]`); if (el) el.focus();
  }
  else if (a === "del") {
    const { o, k } = resolver(b.dataset.p), i = +k, item = o.splice(i, 1)[0];
    sucio(); render();
    toast("Eliminado.", { undo: () => { o.splice(i, 0, item); sucio(); render(); } });
  }
  else if (a === "deshacer") { if (deshacer) { const f = deshacer; deshacer = null; $("#toast").classList.remove("show"); f(); } }
  else if (a === "guardar") guardar();
  else if (a === "conectar") conectar();
  else if (a === "olvidar") { S.cfg.token = ""; guardarCfg(); S.estado = { tipo: "", msg: "Token borrado de este dispositivo." }; render(); }
  else if (a === "exportar") exportar();
  else if (a === "importar") $("#file").click();
});
document.addEventListener("change", e => {
  if (e.target.id !== "file" || !e.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => { try { S.data = normalizar(JSON.parse(r.result)); sucio(); render(); toast("Copia importada. Pulsa Guardar para subirla."); } catch { toast("Ese archivo no es una copia válida.", { err: true }); } };
  r.readAsText(e.target.files[0]);
});
function exportar() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S.data, null, 2)], { type: "application/json" }));
  a.download = `finanzas-${ymd(new Date())}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- GitHub ---------- */
function detectar() {
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i); if (!m) return {};
  const seg = location.pathname.split("/").filter(Boolean)[0];
  return { owner: m[1], repo: seg && !seg.includes(".") ? seg : location.hostname };
}
function cargarCfg() {
  let c = {}; try { c = JSON.parse(localStorage.getItem(CFG_KEY) || "{}") || {}; } catch { c = {}; }
  S.cfg = Object.assign({ owner: "", repo: "", branch: "", path: "data.json", token: "" }, detectar(), c);
}
function guardarCfg() { try { localStorage.setItem(CFG_KEY, JSON.stringify(S.cfg)); } catch { /* sin almacenamiento: la conexión dura hasta cerrar la pestaña */ } }
const cab = () => ({ Authorization: "Bearer " + S.cfg.token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" });
const api = () => `https://api.github.com/repos/${encodeURIComponent(S.cfg.owner)}/${encodeURIComponent(S.cfg.repo)}`;
const apiArchivo = () => `${api()}/contents/${(S.cfg.path || "data.json").split("/").map(encodeURIComponent).join("/")}`;
const ref = () => (S.cfg.branch ? `?ref=${encodeURIComponent(S.cfg.branch)}` : "");
function b64(str) { const b = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function deB64(s) { const bin = atob(s.replace(/\s/g, "")); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
function errorGH(status) {
  return new Error(status === 401 ? "el token no es válido o ya venció." : status === 403 ? "el token no tiene permiso de escritura (Contents: Read and write)." : status === 404 ? "no encuentro ese repositorio; revisa el usuario, el nombre y que el token lo incluya." : status === 409 || status === 422 ? "el archivo cambió mientras editabas; vuelve a pulsar Guardar." : "GitHub respondió con el error " + status + ".");
}
async function guardar() {
  if (S.saving) return;
  if (!(S.cfg.token && S.cfg.owner && S.cfg.repo)) { toast("Conecta GitHub en Ajustes para poder guardar."); location.hash = "ajustes"; return; }
  S.saving = true; renderSave();
  const previo = S.data.actualizado;
  try {
    let sha = null;
    const g = await fetch(apiArchivo() + ref(), { headers: cab(), cache: "no-store" });
    if (g.ok) sha = (await g.json()).sha; else if (g.status !== 404) throw errorGH(g.status);
    S.data.actualizado = new Date().toISOString();
    const body = { message: `Actualizar finanzas (${nombreMes(S.mes)} ${partes(S.mes).y})`, content: b64(JSON.stringify(S.data, null, 2) + "\n") };
    if (sha) body.sha = sha; if (S.cfg.branch) body.branch = S.cfg.branch;
    const r = await fetch(apiArchivo(), { method: "PUT", headers: cab(), body: JSON.stringify(body) });
    if (!r.ok) throw errorGH(r.status);
    S.dirty = false; toast("Guardado en GitHub.");
  } catch (err) {
    S.data.actualizado = previo;
    toast("No se pudo guardar: " + (err instanceof TypeError ? "no hay conexión con GitHub." : err.message), { err: true });
  }
  S.saving = false; renderSave(); renderNav();
}
async function conectar() {
  S.cfg.owner = $("#cfg-owner").value.trim(); S.cfg.repo = $("#cfg-repo").value.trim(); S.cfg.token = $("#cfg-token").value.trim();
  S.cfg.branch = $("#cfg-branch").value.trim(); S.cfg.path = $("#cfg-path").value.trim() || "data.json";
  guardarCfg();
  if (!(S.cfg.token && S.cfg.owner && S.cfg.repo)) { S.estado = { tipo: "err", msg: "Faltan el usuario, el repositorio o el token." }; render(); return; }
  S.estado = { tipo: "", msg: "Probando…" }; render();
  try {
    const r = await fetch(api(), { headers: cab(), cache: "no-store" });
    if (!r.ok) throw errorGH(r.status);
    const info = await r.json();
    if (info.permissions && info.permissions.push === false) throw errorGH(403);
    S.estado = { tipo: "ok", msg: "Conexión lista. Ya puedes guardar desde la página." };
    if (!S.dirty) await cargar();
  } catch (err) { S.estado = { tipo: "err", msg: "No funcionó: " + (err instanceof TypeError ? "no hay conexión con GitHub." : err.message) }; }
  render();
}
/* Con token se lee directo del repositorio (siempre lo último); sin token, el data.json publicado. */
async function cargar() {
  let d = null;
  if (S.cfg.token && S.cfg.owner && S.cfg.repo) {
    try {
      const r = await fetch(apiArchivo() + ref(), { headers: cab(), cache: "no-store" });
      if (r.ok) { d = JSON.parse(deB64((await r.json()).content)); S.fuente = "github"; }
      else if (r.status === 401) toast("El token guardado ya no sirve. Crea uno nuevo en Ajustes.", { err: true });
    } catch { /* sin conexión: se intenta con el archivo publicado */ }
  }
  if (!d) { try { const r = await fetch((S.cfg.path || "data.json") + "?t=" + Date.now(), { cache: "no-store" }); if (r.ok) { d = await r.json(); S.fuente = "pages"; } } catch { /* abierto como archivo local */ } }
  S.data = normalizar(d || JSON.parse(JSON.stringify(DEFAULT_DATA)));
  S.virtual = {};
}

/* ---------- arranque ---------- */
function ruta() { const h = location.hash.slice(1); S.vista = V[h] ? h : "panel"; }
addEventListener("hashchange", () => { ruta(); render(); scrollTo({ top: 0 }); });
addEventListener("beforeunload", e => { if (S.dirty) { e.preventDefault(); e.returnValue = ""; } });
(async function () {
  cargarCfg(); ruta(); reloj(); setInterval(reloj, 15000);
  await cargar(); render();
})();
</script>
